name: Update fares and deploy Pages
on:
  push:
    branches: [main]
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      test_notifications:
        description: Send a channel test instead of real fare alerts
        type: boolean
        default: false
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.event_name != 'issues' || (github.event.sender.login == github.repository_owner && github.event.issue.user.login == github.repository_owner && github.event.issue.title == '候鸟配置：更新监控规则') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and load monitoring policy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/policy.py
      - run: npm test
      - name: Collect cached fares when configured
        if: ${{ !inputs.test_notifications }}
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: |
          if [ -n "$TRAVELPAYOUTS_TOKEN" ]; then
            python3 scripts/collect.py
          else
            echo 'No API token configured; deploying search dashboard without fare data.'
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify new deals or test configured channels
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.qq.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TEST_NOTIFICATIONS: ${{ inputs.test_notifications }}
        run: |
          if [ "$TEST_NOTIFICATIONS" = 'true' ]; then
            python3 scripts/notify.py --test
          else
            python3 scripts/notify.py
          fi
